<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fingerprint Entry Hub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🔐 Fingerprint Entry Hub</h1>
    <p>Attendance Records Viewer</p>
  </header>

  <main>
    <section id="filters">
      <select id="filterOption">
        <option value="all">Show All Entries</option>
        <option value="name">Filter by Name</option>
        <option value="roll">Filter by Roll Number</option>
        <option value="date">Filter by Date</option>
      </select>
      <input type="text" id="filterInput" placeholder="Enter filter value..." />
    </section>

    <table id="dataTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Roll Number</th>
          <th>Date</th>
          <th>Time</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>

  <footer>
    <p>&copy; 2025 Fingerprint Attendance System</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
